name: Ollama direct-choice sensitivity check

on:
  pull_request:
    branches: [main]
    paths:
      - "ollama-choice-runner.mjs"
      - "ollama-score-runner.mjs"
      - ".github/workflows/ollama-choice-sensitivity-check.yml"

permissions:
  contents: read

jobs:
  choice-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check launcher syntax
        run: |
          node --check ollama-choice-runner.mjs
          node --check ollama-score-runner.mjs
          node --check experiments/stateforge-equal-model/run.mjs

      - name: Start deterministic native Ollama mock
        run: |
          cat > /tmp/stateforge-choice-mock.mjs <<'NODE'
          import http from 'node:http';

          const aliases = ['A','B','C','D'];
          const server = http.createServer((req, res) => {
            let body = '';
            req.on('data', c => body += c);
            req.on('end', () => {
              try {
                const parsed = JSON.parse(body);
                if (req.url !== '/api/chat') throw new Error(`url=${req.url}`);
                if (parsed.stream !== false) throw new Error('stream must be false');
                if (parsed.format !== 'json') throw new Error(`format=${JSON.stringify(parsed.format)}`);
                const user = parsed.messages?.find(m => m.role === 'user')?.content ?? '';
                const arch = /ARCHITECTURE WRAPPER: ([a-z]+)/.exec(user)?.[1];
                let first;
                if (arch === 'static') {
                  first = /fixedGraphRecommendation":"([A-D])"/.exec(user)?.[1];
                } else if (arch === 'stateforge') {
                  first = /recommendation":"([A-D])"/.exec(user)?.[1];
                } else {
                  const glyph = Number(/"glyph":(\d)/.exec(user)?.[1] ?? 0);
                  const phase = Number(/"phase":(\d)/.exec(user)?.[1] ?? 0);
                  first = aliases[(glyph + phase + 1) % aliases.length];
                }
                if (!aliases.includes(first)) first = 'C';
                const second = aliases.find(a => a !== first);
                const content = JSON.stringify({ first, second, note: `mock-${arch}` });
                res.writeHead(200, { 'content-type': 'application/json' });
                res.end(JSON.stringify({
                  model: parsed.model,
                  message: { role: 'assistant', content },
                  prompt_eval_count: Math.ceil(body.length / 4),
                  eval_count: Math.ceil(content.length / 4)
                }));
              } catch (error) {
                res.writeHead(500, { 'content-type': 'application/json' });
                res.end(JSON.stringify({ error: error.message }));
              }
            });
          });
          server.listen(18082, '127.0.0.1');
          NODE
          node /tmp/stateforge-choice-mock.mjs >/tmp/stateforge-choice-mock.log 2>&1 &
          echo $! >/tmp/stateforge-choice-mock.pid
          sleep 1

      - name: Execute 90-call direct-choice preflight
        run: |
          rm -rf /tmp/stateforge-choice-check
          node ollama-choice-runner.mjs \
            --provider ollama-native \
            --baseUrl http://127.0.0.1:18082/api \
            --model mock-choice \
            --runs 1 \
            --episodes 30 \
            --batchSize 1 \
            --actions 2 \
            --maxRequests 90 \
            --maxOutputTokens 128 \
            --inputTokenLimit 300000 \
            --outputTokenLimit 30000 \
            --requestTimeoutMs 60000 \
            --wallLimitMs 600000 \
            --output /tmp/stateforge-choice-check

      - name: Verify direct choices, sensitivity and finalisation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const dir = '/tmp/stateforge-choice-check';
          const r = JSON.parse(fs.readFileSync(`${dir}/results.json`, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(`${dir}/run-manifest.json`, 'utf8'));
          const partial = JSON.parse(fs.readFileSync(`${dir}/partial-results.json`, 'utf8'));
          const finalized = JSON.parse(fs.readFileSync(`${dir}/FINALIZED.json`, 'utf8'));
          if (r.evaluator !== 'stateforge-local-direct-choice-sensitivity-v4') throw new Error(r.evaluator);
          if (r.errors.length) throw new Error(JSON.stringify(r.errors));
          if (r.requestLedger.length !== 90) throw new Error(`requests=${r.requestLedger.length}`);
          if (!r.requestLedger.every(x => typeof x.rawResponse === 'string')) throw new Error('raw response missing');
          for (const x of r.requestLedger) {
            const p = JSON.parse(x.rawResponse);
            if (!['A','B','C','D'].includes(p.first)) throw new Error(`first=${p.first}`);
            if (!['A','B','C','D'].includes(p.second) || p.first === p.second) throw new Error(`second=${p.second}`);
          }
          if (!r.sensitivity?.gates?.allPassed) throw new Error(JSON.stringify(r.sensitivity, null, 2));
          const statuses = [r.status, manifest.status, partial.status, finalized.status];
          if (statuses.includes('running') || new Set(statuses).size !== 1) throw new Error(statuses.join(','));
          console.log(JSON.stringify({ status:r.status, sensitivity:r.sensitivity, requests:r.requestLedger.length }, null, 2));
          NODE
          cd /tmp/stateforge-choice-check
          sha256sum -c checksums.sha256
