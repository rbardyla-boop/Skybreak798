name: Ollama schema adapter check

on:
  pull_request:
    branches: [main]
    paths:
      - "ollama-single-runner.mjs"
      - "local-single-runner.mjs"
      - ".github/workflows/ollama-schema-adapter-check.yml"

permissions:
  contents: read

jobs:
  adapter-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check source syntax
        run: |
          node --check ollama-single-runner.mjs
          node --check local-single-runner.mjs
          node --check experiments/stateforge-equal-model/run.mjs

      - name: Start deterministic native Ollama mock
        run: |
          cat > /tmp/stateforge-ollama-mock.mjs <<'NODE'
          import http from 'node:http';
          let requests = 0;
          const server = http.createServer((req, res) => {
            let body = '';
            req.on('data', c => body += c);
            req.on('end', () => {
              try {
                requests++;
                const parsed = JSON.parse(body);
                if (req.url !== '/api/chat') throw new Error(`url=${req.url}`);
                if (parsed.stream !== false) throw new Error('stream must be false');
                const schema = parsed.format;
                if (!schema || schema.type !== 'object') throw new Error('missing native format schema');
                const decisions = schema.properties?.decisions;
                if (decisions?.minItems !== 1 || decisions?.maxItems !== 1) throw new Error('decision cardinality not fixed at one');
                const rankingEnum = decisions?.items?.properties?.ranking?.enum;
                if (!Array.isArray(rankingEnum) || rankingEnum.length !== 24) throw new Error(`legal ranking count=${rankingEnum?.length}`);
                const content = JSON.stringify({ decisions: [{ ranking: rankingEnum[requests % rankingEnum.length], note: 'mock' }] });
                res.writeHead(200, { 'content-type': 'application/json' });
                res.end(JSON.stringify({
                  model: parsed.model,
                  message: { role: 'assistant', content },
                  done: true,
                  done_reason: 'stop',
                  prompt_eval_count: Math.ceil(body.length / 4),
                  eval_count: 24
                }));
              } catch (error) {
                res.writeHead(400, { 'content-type': 'application/json' });
                res.end(JSON.stringify({ error: error.message }));
              }
            });
          });
          server.listen(18081, '127.0.0.1');
          NODE
          node /tmp/stateforge-ollama-mock.mjs >/tmp/stateforge-ollama-mock.log 2>&1 &
          sleep 1

      - name: Generate and execute adapter
        run: |
          rm -rf /tmp/stateforge-ollama-check
          node ollama-single-runner.mjs \
            --provider ollama-native \
            --baseUrl http://127.0.0.1:18081/api \
            --model mock \
            --jsonMode true \
            --runs 1 \
            --episodes 2 \
            --batchSize 1 \
            --actions 2 \
            --maxRequests 6 \
            --maxOutputTokens 128 \
            --inputTokenLimit 100000 \
            --outputTokenLimit 10000 \
            --requestTimeoutMs 60000 \
            --wallLimitMs 600000 \
            --output /tmp/stateforge-ollama-check

      - name: Verify orchestration and evidence
        run: |
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/stateforge-ollama-check/results.json', 'utf8'));
          if (r.errors.length) throw new Error(JSON.stringify(r.errors));
          if (r.evaluator !== 'stateforge-local-single-observation-v2-ollama-schema') throw new Error(`evaluator=${r.evaluator}`);
          if (r.runs.length !== 1) throw new Error(`runs=${r.runs.length}`);
          if (r.requestLedger.length !== 6) throw new Error(`requests=${r.requestLedger.length}`);
          for (const a of ['stateforge','loop','static']) {
            if (r.runs[0].metrics[a].modelCalls !== 2) throw new Error(`${a} calls=${r.runs[0].metrics[a].modelCalls}`);
            if (r.runs[0].integrity[a].unloggedControlTransitions !== 0) throw new Error(`${a} unlogged transition`);
          }
          console.log(JSON.stringify({status:r.status, evaluator:r.evaluator, requests:r.requestLedger.length, integrity:r.aggregate.integrity}, null, 2));
          NODE
